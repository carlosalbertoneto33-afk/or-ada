<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Família Orçada | Gestão Financeira</title><link rel="icon" type="image/png" href="/static/logo.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f8faf9;color:#10231a}
aside{position:fixed;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid #e5e7eb;padding:20px 8px;display:flex;flex-direction:column}
main{margin-left:248px;padding:32px}h1{margin:0;font-size:30px}h3{margin:0 0 16px;font-size:18px}.sub{color:#5b6b63;margin:4px 0 24px}
.logo{display:flex;gap:10px;align-items:center;padding:0 12px 24px}.logo i{width:40px;height:40px;border-radius:10px;background:#0f7d57;color:#fff;display:grid;place-items:center;font-style:normal}
.logo small{display:block;color:#5b6b63;font-size:12px}nav a{display:block;padding:10px 12px;margin-bottom:4px;border-radius:10px;color:#4b5b53;cursor:pointer;font-weight:500}nav a.on{background:#0f7d57;color:#fff}
.foot{margin-top:auto;padding:12px;font-size:12px;color:#5b6b63}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;box-shadow:0 1px 3px #0001}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.big{font-size:24px;font-weight:700;margin:8px 0}.pos{color:#0f7d57}.neg{color:#dc2626}.mut{color:#5b6b63;font-size:12px}
button,.btn{background:#0f7d57;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}button.g{background:#fff;color:#10231a;border:1px solid #d1d5db}button.r{background:#dc2626}
.top{display:flex;justify-content:space-between;align-items:flex-start}input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit;margin-top:4px;background:#fff}input[type=checkbox]{width:auto}
.bar{height:8px;background:#d1e7dd;border-radius:9px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:#0f7d57}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;gap:12px}.tx{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:10px}.tag{background:#eef2ef;border-radius:6px;padding:2px 8px;font-size:12px}.ft{display:flex;gap:12px;margin-bottom:20px}
.ov{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:9}.md{background:#fff;border-radius:14px;padding:24px;width:min(420px,92vw);max-height:90vh;overflow:auto}.md label{display:block;margin-bottom:12px;font-weight:500}.bt{display:flex;gap:8px;justify-content:flex-end}
.auth{max-width:420px;margin:12vh auto;text-align:center}.auth form{text-align:left;margin-top:24px}.ava{width:110px;height:110px;border-radius:50%;background:#e6f2ec;object-fit:cover;display:grid;place-items:center;font-size:36px;margin:auto;color:#0f7d57}
.logo img{width:40px;height:40px;border-radius:10px}
@media(max-width:800px){aside{position:static;width:auto}main{margin:0;padding:16px}.g4,.g2{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><script>
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),$=s=>document.querySelector(s);
const api=async(u,m='GET',b)=>{const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||'Erro'),{code:r.status});return j};
const CATS=['Alimentação','Moradia','Mesada','Investimento','Educação','Saúde','Transporte','Lazer','Outro'];
const COL={Alimentação:'#f59e0b',Moradia:'#6366f1',Mesada:'#10b981',Investimento:'#14b8a6',Educação:'#3b82f6',Saúde:'#ef4444',Transporte:'#8b5cf6',Lazer:'#ec4899',Outro:'#9ca3af'};
const ROLES=['Pai','Mãe','Filho(a)','Outro'],METH=['Pix','Cartão','Dinheiro','Transferência'],MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const S={user:null,page:'painel',members:[],tx:[],goals:[],f:{q:'',type:'',cat:'',mem:''},months:6};let ch=[];
const today=()=>new Date().toISOString().slice(0,10),ym=d=>(d||'').slice(0,7);
const fd=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace(/\./g,''):'';
const mname=id=>(S.members.find(m=>m.id==id)||{}).name||'';
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const lastMonths=n=>{const o=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);o.push({k:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),l:MES[x.getMonth()]})}return o};
const byCat=l=>{const o={};l.filter(t=>t.type=='despesa').forEach(t=>o[t.category]=(o[t.category]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
function modal(title,fields,v,save,del){const m=document.createElement('div');m.className='ov';
m.innerHTML=`<form class="md"><h3>${title}</h3>${fields.map(([n,l,t,o])=>`<label>${l}${t=='select'?`<select name="${n}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${a}" ${v[n]==a?'selected':''}>${b}</option>`}).join('')}</select>`:`<input name="${n}" type="${t}" step="any" value="${v[n]??''}" ${t=='checkbox'&&v[n]?'checked':''} ${t=='checkbox'?'':'required'}>`}</label>`).join('')}<div class="bt"><button type="button" class="g" id="cx">Cancelar</button>${del?'<button type="button" class="r" id="dl">Excluir</button>':''}<button>Salvar</button></div></form>`;
document.body.append(m);const f=m.firstChild;f.querySelector('#cx').onclick=()=>m.remove();
if(del)f.querySelector('#dl').onclick=async()=>{if(confirm('Excluir?')){await del();m.remove();await go()}};
f.onsubmit=async e=>{e.preventDefault();const d={};fields.forEach(([n,,t])=>{const x=f.elements[n];d[n]=t=='checkbox'?+x.checked:t=='number'?+x.value:x.value});try{await save(d);m.remove();await go()}catch(x){alert(x.message)}}}
async function load(){[S.members,S.tx,S.goals]=await Promise.all([api('members'),api('transactions'),api('goals')]);S.tx.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}
async function go(p){if(p)S.page=p;await load();render()}
const MEMOPT=()=>[['','— Nenhum —'],...S.members.map(m=>[m.id,m.name])];
function authView(reg){$('#app').innerHTML=`<div class="auth"><div class="logo" style="justify-content:center;padding:0"><img src="/static/logo.png" style="width:72px;height:72px;border-radius:16px"></div><h1 style="margin-top:16px">${reg?'Criar conta':'Bem-vindo de volta'}</h1><p class="sub">${reg?'Comece a organizar sua família':'Entre na sua conta'}</p><div class="card"><form id="af">${reg?'<label>Nome<input name="name" required></label><br>':''}<label>E-mail<input name="email" type="email" placeholder="seu@email.com" required></label><br><label>Senha<input name="password" type="password" minlength="6" required></label><br><button style="width:100%">${reg?'Criar conta':'Entrar'}</button></form></div><p class="mut" style="margin-top:20px">${reg?'Já tem conta?':'Não tem uma conta?'} <a href="#" id="sw" style="color:#0f7d57;font-weight:700">${reg?'Entrar':'Criar conta'}</a></p></div>`;
$('#sw').onclick=e=>{e.preventDefault();authView(!reg)};$('#af').onsubmit=async e=>{e.preventDefault();try{await api(reg?'register':'login','POST',Object.fromEntries(new FormData(e.target)));if(reg)await api('seed','POST');init()}catch(x){alert(x.message)}}}
const NAV=[['painel','Painel'],['familia','Família'],['transacoes','Transações'],['metas','Metas'],['relatorios','Relatórios'],['perfil','Perfil']];
function render(){ch.forEach(c=>c.destroy());ch=[];const P={painel,familia,transacoes,metas,relatorios,perfil}[S.page]();
$('#app').innerHTML=`<aside><div class="logo"><img src="/static/logo.png"><div><b>Família Orçada</b><small>Gestão Financeira</small></div></div><nav>${NAV.map(([k,l])=>`<a class="${S.page==k?'on':''}" data-p="${k}">${l}</a>`).join('')}</nav><div class="foot">Feito para famílias brasileiras 💚</div></aside><main>${P.html}</main>`;
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.p));P.after&&P.after()}
const head=(t,s,b)=>`<div class="top"><div><h1>${t}</h1><p class="sub">${s}</p></div>${b||''}</div>`;
const chart=(id,cfg)=>ch.push(new Chart($(id),cfg));
function painel(){const k=today().slice(0,7),mt=S.tx.filter(t=>ym(t.date)==k),rec=sum(mt.filter(t=>t.type=='receita'),t=>t.amount),des=sum(mt.filter(t=>t.type=='despesa'),t=>t.amount),sal=rec-des,ms=lastMonths(6);
const ag=S.goals.filter(g=>g.current<g.target).slice(0,3),cats=byCat(mt);
const card=(l,v,c,s)=>`<div class="card"><span class="mut" style="font-size:14px">${l}</span><div class="big ${c}">${v}</div><span class="mut">${s||''}</span></div>`;
return{html:head('Painel',new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))+(S.members.length+S.tx.length+S.goals.length?'':'<div class="card" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center"><span>Seu painel está vazio. Quer ver o app com dados de exemplo?</span><button id="sd">Carregar exemplos</button></div>')+`<div class="g4">${card('Saldo do Mês',R(sal),sal<0?'neg':'pos','Receitas - Despesas')}${card('Receitas',R(rec),'pos')}${card('Despesas',R(des),'neg')}${card('Mesada Total',R(sum(S.members,m=>m.allowance)),'',S.members.length+' membros ativos')}</div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:20px"><div class="card"><h3>Fluxo Financeiro</h3><canvas id="c1" height="150"></canvas></div><div class="card"><h3>Despesas por Categoria</h3>${cats.length?'<canvas id="c2"></canvas>':'<p class="mut" style="text-align:center;margin-top:80px">Sem despesas neste mês</p>'}</div></div>
<div class="g2"><div class="card"><h3>Transações Recentes</h3>${S.tx.slice(0,5).map(t=>`<div class="row"><span><span class="dot" style="background:${COL[t.category]||'#999'}"></span><b>${t.title}</b><br><span class="mut">${fd(t.date)} · ${t.category}</span></span><b class="${t.type=='receita'?'pos':'neg'}">${t.type=='receita'?'+':'-'}${R(t.amount)}</b></div>`).join('')||'<p class="mut">Nenhuma transação</p>'}</div>
<div class="card"><h3>Metas Ativas</h3>${ag.map(g=>`<b>${g.title}</b><div class="bar"><b style="width:${Math.min(100,g.current/g.target*100)}%"></b></div><div class="row mut" style="padding:0 0 14px"><span>${R(g.current)}</span><span>${R(g.target)}</span></div>`).join('')||'<p class="mut">Nenhuma meta ativa</p>'}</div></div>`,
after(){const sd=$('#sd');if(sd)sd.onclick=async()=>{await api('seed','POST');go()};chart('#c1',{type:'line',data:{labels:ms.map(m=>m.l),datasets:[['Receitas','receita','#10b981'],['Despesas','despesa','#ef4444']].map(([n,t,c])=>({label:n,borderColor:c,backgroundColor:c+'22',fill:true,tension:.4,data:ms.map(m=>sum(S.tx.filter(x=>ym(x.date)==m.k&&x.type==t),x=>x.amount))}))}});
if(cats.length)chart('#c2',{type:'doughnut',data:{labels:cats.map(c=>c[0]),datasets:[{data:cats.map(c=>c[1]),backgroundColor:cats.map(c=>COL[c[0]]||'#999')}]}})}}}
function familia(){const k=today().slice(0,7);
return{html:head('Família',S.members.length+' membros cadastrados','<button id="nm">+ Novo Membro</button>')+`<div class="g3">${S.members.map(m=>{const g=sum(S.tx.filter(t=>t.member_id==m.id&&t.type=='despesa'&&ym(t.date)==k),t=>t.amount);return`<div class="card" data-m="${m.id}" style="cursor:pointer"><div class="row" style="justify-content:flex-start"><div class="ava" style="width:48px;height:48px;font-size:16px;margin:0">${m.name.slice(0,2).toUpperCase()}</div><div><b>${m.name}</b><br><span class="tag">${m.role}</span> <span class="mut">${m.age} anos</span></div></div><div class="row" style="padding:4px 0"><span class="mut" style="font-size:14px">Mesada</span><b>${R(m.allowance)}</b></div><div class="row" style="padding:4px 0"><span class="mut" style="font-size:14px">Gasto neste mês</span><b>${R(g)}</b></div><div class="bar"><b style="width:${m.allowance?Math.min(100,g/m.allowance*100):0}%"></b></div></div>`}).join('')}</div>`,
after(){const F=[['name','Nome','text'],['role','Parentesco','select',ROLES],['age','Idade','number'],['allowance','Mesada (R$)','number']];
$('#nm').onclick=()=>modal('Novo Membro',F,{},d=>api('members','POST',d));
document.querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>{const m=S.members.find(x=>x.id==c.dataset.m);modal('Editar Membro',F,m,d=>api('members/'+m.id,'PUT',d),()=>api('members/'+m.id,'DELETE'))})}}}
function transacoes(){const f=S.f,l=S.tx.filter(t=>(!f.q||t.title.toLowerCase().includes(f.q.toLowerCase()))&&(!f.type||t.type==f.type)&&(!f.cat||t.category==f.cat)&&(!f.mem||t.member_id==f.mem));
const rec=sum(l.filter(t=>t.type=='receita'),t=>t.amount),des=sum(l.filter(t=>t.type=='despesa'),t=>t.amount);
const opt=(a,v)=>a.map(x=>{const[i,n]=Array.isArray(x)?x:[x,x];return`<option value="${i}" ${v==i?'selected':''}>${n}</option>`}).join('');
return{html:head('Transações',l.length+' registros','<button id="nt">+ Nova Transação</button>')+`<div class="g4" style="grid-template-columns:repeat(3,1fr)"><div class="card"><span class="mut">Receitas (filtradas)</span><div class="big pos">${R(rec)}</div></div><div class="card"><span class="mut">Despesas (filtradas)</span><div class="big neg">${R(des)}</div></div><div class="card"><span class="mut">Saldo</span><div class="big">${R(rec-des)}</div></div></div>
<div class="card ft"><input id="fq" placeholder="Buscar..." value="${f.q}"><select id="ft"><option value="">Todos os tipos</option>${opt([['receita','Receita'],['despesa','Despesa']],f.type)}</select><select id="fc"><option value="">Todas as categorias</option>${opt(CATS,f.cat)}</select><select id="fm"><option value="">Todos os membros</option>${opt(MEMOPT().slice(1),f.mem)}</select></div>
${l.map(t=>`<div class="card tx" data-t="${t.id}"><span><b>${t.title}</b> ${t.recurring?'<span class="tag">Recorrente</span>':''}<br><span class="mut">${fd(t.date)} · ${t.category} · ${t.method||''}${t.member_id?' · '+mname(t.member_id):''}</span></span><b class="${t.type=='receita'?'pos':'neg'}">${t.type=='receita'?'+':'-'}${R(t.amount)}</b></div>`).join('')}`,
after(){const F=[['title','Descrição','text'],['amount','Valor (R$)','number'],['type','Tipo','select',[['despesa','Despesa'],['receita','Receita']]],['category','Categoria','select',CATS],['method','Forma de pagamento','select',METH],['date','Data','date'],['member_id','Membro','select',MEMOPT()],['recurring','Recorrente','checkbox']];
$('#nt').onclick=()=>modal('Nova Transação',F.map(x=>x[0]=='member_id'?x:x),{date:today(),type:'despesa'},d=>api('transactions','POST',d));
document.querySelectorAll('[data-t]').forEach(c=>c.onclick=()=>{const t=S.tx.find(x=>x.id==c.dataset.t);modal('Editar Transação',F,t,d=>api('transactions/'+t.id,'PUT',d),()=>api('transactions/'+t.id,'DELETE'))});
const bind=(id,k)=>$(id).onchange=e=>{S.f[k]=e.target.value;render()};$('#fq').oninput=e=>{S.f.q=e.target.value;render();const i=$('#fq');i.focus();i.setSelectionRange(99,99)};bind('#ft','type');bind('#fc','cat');bind('#fm','mem')}}}
function metas(){const at=S.goals.filter(g=>g.current<g.target),ok=S.goals.filter(g=>g.current>=g.target);
const c=g=>{const p=Math.min(100,Math.round(g.current/g.target*100));return`<div class="card" data-g="${g.id}"><b>${g.title}</b><br><span class="mut">${mname(g.member_id)?mname(g.member_id)+' · ':''}Prazo: ${fd(g.deadline)}</span><div class="bar"><b style="width:${p}%"></b></div><div class="row" style="padding:0"><b>${R(g.current)}</b><span class="mut">${R(g.target)}</span></div><div class="row"><span class="tag">${p}% concluído</span>${p<100?`<button class="g" data-a="${g.id}">+ Aportar</button>`:''}</div></div>`};
return{html:head('Metas',at.length+' ativas · '+ok.length+' concluídas','<button id="ng">+ Nova Meta</button>')+`<p class="mut">ATIVAS</p><div class="g3">${at.map(c).join('')}</div><p class="mut" style="margin-top:28px">CONCLUÍDAS</p><div class="g3">${ok.map(c).join('')}</div>`,
after(){const F=[['title','Título','text'],['target','Valor da meta (R$)','number'],['current','Valor atual (R$)','number'],['deadline','Prazo','date'],['member_id','Membro','select',MEMOPT()]];
$('#ng').onclick=()=>modal('Nova Meta',F,{current:0},d=>api('goals','POST',d));
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();modal('Aportar',[['amount','Valor (R$)','number']],{},d=>api(`goals/${b.dataset.a}/deposit`,'POST',d))});
document.querySelectorAll('[data-g]').forEach(c=>c.onclick=()=>{const g=S.goals.find(x=>x.id==c.dataset.g);modal('Editar Meta',F,g,d=>api('goals/'+g.id,'PUT',d),()=>api('goals/'+g.id,'DELETE'))})}}}
function relatorios(){const ms=lastMonths(S.months),keys=ms.map(m=>m.k),l=S.tx.filter(t=>keys.includes(ym(t.date))),rec=sum(l.filter(t=>t.type=='receita'),t=>t.amount),des=sum(l.filter(t=>t.type=='despesa'),t=>t.amount),cats=byCat(l);
const cd=(a,b,c)=>`<div class="card"><span class="mut">${a}</span><div class="big ${c}">${R(b)}</div></div>`;
return{html:head('Relatórios','Análise dos últimos '+S.months+' meses',`<select id="pm" style="width:140px">${[3,6,12].map(n=>`<option value="${n}" ${S.months==n?'selected':''}>${n} meses</option>`).join('')}</select>`)+`<div class="g4">${cd('Receitas totais',rec,'pos')}${cd('Despesas totais',des,'neg')}${cd('Saldo acumulado',rec-des,'pos')}${cd('Despesa média/mês',des/S.months,'')}</div>
<div class="card"><h3>Receitas vs Despesas</h3><canvas id="c1" height="90"></canvas></div><div class="g2"><div class="card"><h3>Despesas por Categoria</h3><canvas id="c2"></canvas></div><div class="card"><h3>Detalhamento por Categoria</h3>${cats.map(([n,v])=>`<div class="row" style="padding:8px 0 0"><span><span class="dot" style="background:${COL[n]||'#999'}"></span>${n}</span><span><span class="mut">${(v/des*100).toFixed(1)}%</span> <b>${R(v)}</b></span></div><div class="bar"><b style="width:${v/des*100}%;background:${COL[n]||'#999'}"></b></div>`).join('')}</div></div>`,
after(){$('#pm').onchange=e=>{S.months=+e.target.value;render()};chart('#c1',{type:'bar',data:{labels:ms.map(m=>m.l),datasets:[['Receitas','receita','#10b981'],['Despesas','despesa','#ef4444']].map(([n,t,c])=>({label:n,backgroundColor:c,borderRadius:4,data:ms.map(m=>sum(l.filter(x=>ym(x.date)==m.k&&x.type==t),x=>x.amount))}))}});
chart('#c2',{type:'pie',data:{labels:cats.map(c=>c[0]),datasets:[{data:cats.map(c=>c[1]),backgroundColor:cats.map(c=>COL[c[0]]||'#999')}]}})}}}
function perfil(){const u=S.user;
return{html:head('Perfil','Gerencie sua conta e foto de perfil')+`<div class="card" style="text-align:center">${u.photo?`<img class="ava" src="${u.photo}">`:`<div class="ava">${u.name[0].toUpperCase()}</div>`}<p><button class="g" onclick="$('#ph').click()">📷 Alterar foto</button><input id="ph" type="file" accept="image/*" hidden></p><h3>${u.name}</h3><span class="mut">${u.email}</span></div>
<div class="card" style="margin-top:20px"><h3>Informações da conta</h3><div class="card" style="margin-bottom:12px"><span class="mut">Email</span><br><b>${u.email}</b></div><div class="card"><span class="mut">Função</span><br><b>${u.role}</b></div></div><div class="card" style="margin-top:20px"><button class="r" id="lo" style="width:100%">Sair da conta</button></div>`,
after(){$('#lo').onclick=async()=>{await api('logout','POST');S.user=null;authView()};
$('#ph').onchange=e=>{const im=new Image();im.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=256;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);S.user.photo=c.toDataURL('image/jpeg',.8);await api('photo','POST',{photo:S.user.photo});render()};im.src=URL.createObjectURL(e.target.files[0])}}}}
async function init(){try{S.user=await api('me');await go('painel')}catch(e){authView()}}init();
</script></body></html>
